server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: menu-restaurante-crud
  datasource:
    # Por defecto apunta al PostgreSQL de docker-compose expuesto en localhost.
    # Dentro de Docker, DB_HOST=db (nombre del servicio).
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:menu_restaurante}
    username: ${DB_USER:menu_user}
    password: ${DB_PASSWORD:menu_pass}
  jpa:
    hibernate:
      # update: Hibernate crea/ajusta la tabla a partir de la entidad (entorno académico/desarrollo)
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

